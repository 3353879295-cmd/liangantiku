[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grain-quiz"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "rapidfuzz>=3.9,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
grain-quiz = "grain_quiz.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
